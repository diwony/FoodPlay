name = "foodplay-yt-search"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 같은 검색을 24시간 재사용해 API 할당량을 아끼는 캐시.
# 배포 전 1회:  npx wrangler kv namespace create CACHE
# 명령이 출력하는 id 를 아래 id = "" 에 채운다.
[[kv_namespaces]]
binding = "CACHE"
id = ""

# API 키는 이 파일에 넣지 않는다. 배포 후 1회:
#   npx wrangler secret put YT_API_KEY
# (로컬 개발은 .dev.vars 파일 — gitignore 됨)

# 무료 내장 Rate Limiting. 캐시에 없어서 YouTube 를 실제로 부를 때만 카운트한다.
# IP 하나가 60초에 20회 초과로 새 검색을 날리면 그 IP만 잠깐 빈 결과를 받는다
# (봇이 서로 다른 검색어로 하루 할당량을 태우는 걸 막는 목적). 시크릿·비용 없음.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
